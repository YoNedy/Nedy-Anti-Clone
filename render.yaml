services:
  - type: web
    name: cloneguard-bot
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_BOT_TOKEN
        sync: false          # you'll paste this in the Render dashboard
      - key: DISCORD_LOG_CHANNEL_ID
        sync: false          # optional — channel ID for ban/flag logs
